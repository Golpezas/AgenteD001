# ──────────────────────────────────────────────
# docker-compose.yml — Project AgenteD
# ──────────────────────────────────────────────
# Uso: docker compose up --build
# ──────────────────────────────────────────────

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agented-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agented-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agented-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - agented-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: agented-db
    env_file:
      - .env
    volumes:
      - agented-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agented} -d ${POSTGRES_DB:-agented}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agented-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: agented-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - agented-network
    restart: unless-stopped

networks:
  agented-network:
    driver: bridge

volumes:
  agented-pgdata:
