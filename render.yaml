# ──────────────────────────────────────────────
# render.yaml — Render Blueprint
# ──────────────────────────────────────────────
# Backend service + PostgreSQL managed
# ──────────────────────────────────────────────

services:
  - type: web
    name: agented-backend
    runtime: image
    repo: https://github.com/your-org/Project_AgenteD
    branch: main
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agented-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
    healthCheckPath: /health

databases:
  - name: agented-db
    plan: starter
    databaseName: agented
    user: agented
