# ──────────────────────────────────────────────
# Alembic — Configuración de migraciones
# ──────────────────────────────────────────────
# El directorio de scripts se resuelve relativo a este archivo.
# sqlalchemy.url se sobrescribe en env.py desde config de la app.
# ──────────────────────────────────────────────

[alembic]
script_location = backend/migrations
prepend_sys_path = .

# La URL se configura dinámicamente en env.py para soportar async
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
